[project]
name = "custom-llm"
version = "0.1.0"
description = "Small Reasoning LLM with MoE and CoT for educational purposes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6.0",
    "numpy>=2.0.0",
    "tqdm>=4.66.0",
    "datasets>=3.0.0",
    "tokenizers>=0.21.0",
    "transformers>=4.48.0",
    "wandb>=0.19.0",
    "matplotlib>=3.9.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu130"}]
torchvision = [{index = "pytorch-cu130"}]
torchaudio = [{index = "pytorch-cu130"}]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
